        // Setup the game
        function createSnow() {
            // Create snow particles system
            const snowGroup = new THREE.Group();
            const snowCount = 2000;
            
            // Create snow particle geometry and material
            const snowGeometry = new THREE.BufferGeometry();
            const snowMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.2,
                transparent: true,
                opacity: 0.8,
                map: createSnowflakeTexture(),
                depthWrite: false
            });
            
            // Create positions for each snowflake
            const positions = new Float32Array(snowCount * 3);
            const velocities = [];
            
            for (let i = 0; i < snowCount; i++) {
                // Position snowflakes in a large box area around the scene
                const x = (Math.random() - 0.5) * 200;
                const y = Math.random() * 80;
                const z = (Math.random() - 0.5) * 200;
                
                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;
                
                // Add random velocity for animation
                velocities.push({
                    x: (Math.random() - 0.5) * 0.05,
                    y: -0.1 - Math.random() * 0.1,
                    z: (Math.random() - 0.5) * 0.05
                });
            }
            
            snowGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const snowParticleSystem = new THREE.Points(snowGeometry, snowMaterial);
            snowGroup.add(snowParticleSystem);
            scene.add(snowGroup);
            
            // Store particles for animation
            snowParticles.push({
                system: snowParticleSystem,
                geometry: snowGeometry,
                velocities: velocities
            });
        }
        
        function createSnowflakeTexture() {
            // Create a canvas texture for snowflakes
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const context = canvas.getContext('2d');
            
            // Draw a circle for the snowflake
            context.beginPath();
            context.arc(16, 16, 8, 0, Math.PI * 2, false);
            context.fillStyle = 'white';
            context.fill();
            
            // Create a texture from the canvas
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }
        
        function animateSnow() {
            if (snowParticles.length === 0) return;
            
            // Update each snow particle system
            for (const particles of snowParticles) {
                const positions = particles.geometry.attributes.position.array;
                
                for (let i = 0; i < positions.length / 3; i++) {
                    // Update positions based on velocity
                    positions[i * 3] += particles.velocities[i].x;
                    positions[i * 3 + 1] += particles.velocities[i].y;
                    positions[i * 3 + 2] += particles.velocities[i].z;
                    
                    // Reset particles that fall below the ground
                    if (positions[i * 3 + 1] < 0) {
                        positions[i * 3] = (Math.random() - 0.5) * 200;
                        positions[i * 3 + 1] = 80;
                        positions[i * 3 + 2] = (Math.random() - 0.5) * 200;
                    }
                }
                
                particles.geometry.attributes.position.needsUpdate = true;
            }
        }
        
        function animateIcebergs() {
            if (icebergs.length === 0 || !temperature) return;
            
            const meltSpeed = 0.001;
            
            for (const iceberg of icebergs) {
                // Only animate melting if temperature is high enough and iceberg is set to melt
                if (temperature > 0 && iceberg.userData.melting) {
                    // Slowly sink the iceberg
                    if (iceberg.position.y > 0) {
                        iceberg.position.y -= meltSpeed * temperature;
                    }
                    
                    // Animate water puddles
                    iceberg.traverse((child) => {
                        if (child.isMesh && child.userData.melting) {
                            // Expand puddles
                            const meltFactor = temperature * 0.001;
                            child.scale.x += meltFactor;
                            child.scale.z += meltFactor;
                        }
                    });
                } else if (temperature <= 0 && !factoryFound) {
                    // If temperature drops, start restoring icebergs
                    if (iceberg.position.y < iceberg.userData.originalHeight) {
                        iceberg.position.y += meltSpeed * 2;
                        
                        if (iceberg.position.y > iceberg.userData.originalHeight) {
                            iceberg.position.y = iceberg.userData.originalHeight;
                        }
                    }
                    
                    // Shrink water puddles back
                    iceberg.traverse((child) => {
                        if (child.isMesh && child.userData.melting && child.userData.originalScale) {
                            child.scale.lerp(child.userData.originalScale, 0.01);
                        }
                    });
                }
                
                // If it's a marker iceberg, make it glow/pulse
                if (iceberg.userData.isMarker) {
                    const pulseSpeed = 1.5;
                    const time = Date.now() * 0.001;
                    
                    // Make the glow pulse
                    if (iceberg.children[1]) { // The glow is the second child
                        iceberg.children[1].material.opacity = 0.2 + 0.1 * Math.sin(time * pulseSpeed);
                    }
                    
                    // Rotate the symbol on top
                    if (iceberg.children[2]) { // The symbol is the third child
                        iceberg.children[2].rotation.y += 0.01;
                    }
                }
            }
        }
        
        function animateBearWalking() {
            if (!bear || !bear.userData.legJoints) return;
            
            // Update the walking cycle if the bear is moving
            if (isWalking) {
                walkingCycle += 0.6;
                
                // Get leg joints
                const { frontLeft, frontRight, backLeft, backRight } = bear.userData.legJoints;
                
                // Animate the legs with opposite phases
                frontLeft.shoulder.rotation.x = Math.sin(walkingCycle) * 0.3;
                frontLeft.knee.rotation.x = Math.sin(walkingCycle + Math.PI/4) * 0.2;
                
                frontRight.shoulder.rotation.x = Math.sin(walkingCycle + Math.PI) * 0.3;
                frontRight.knee.rotation.x = Math.sin(walkingCycle + Math.PI + Math.PI/4) * 0.2;
                
                backLeft.hip.rotation.x = Math.sin(walkingCycle + Math.PI) * 0.3;
                backLeft.knee.rotation.x = Math.sin(walkingCycle + Math.PI*5/4) * 0.2;
                
                backRight.hip.rotation.x = Math.sin(walkingCycle) * 0.3;
                backRight.knee.rotation.x = Math.sin(walkingCycle + Math.PI*5/4) * 0.2;
                
                // Add a slight body motion
                bear.children[0].position.y = 1.5 + Math.abs(Math.sin(walkingCycle)) * 0.1;
            } else {
                // Reset leg positions when not walking
                const { frontLeft, frontRight, backLeft, backRight } = bear.userData.legJoints;
                
                frontLeft.shoulder.rotation.x = 0;
                frontLeft.knee.rotation.x = 0;
                
                frontRight.shoulder.rotation.x = 0;
                frontRight.knee.rotation.x = 0;
                
                backLeft.hip.rotation.x = 0;
                backLeft.knee.rotation.x = 0;
                
                backRight.hip.rotation.x = 0;
                backRight.knee.rotation.x = 0;
                
                bear.children[0].position.y = 1.5;
            }
        }

// Create a circular white texture using canvas
function createCircleTexture() {
    const size = 64;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');

    // Draw a white circle with soft edges
    const gradient = ctx.createRadialGradient(
        size / 2, size / 2, 0,
        size / 2, size / 2, size / 2
    );
    gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, size, size);

    const texture = new THREE.CanvasTexture(canvas);
    return texture;
}

        function createIcebergGradientTexture() {
    const size = 128;
    const canvas = document.createElement('canvas');
    canvas.width = 1;
    canvas.height = size;
    const ctx = canvas.getContext('2d');

    const gradient = ctx.createLinearGradient(0, 0, 0, size);
    gradient.addColorStop(0.0, '#ffffff');   // top: snow white
    gradient.addColorStop(0.3, '#d8f0ff');   // middle: pale blue ice
    gradient.addColorStop(0.7, '#a0c0cc');   // lower: deeper cold ice
    gradient.addColorStop(1.0, '#3f3f3f');   // bottom: rocky gray

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 1, size);

    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.ClampToEdgeWrapping;
    texture.magFilter = THREE.LinearFilter;
    return texture;
}

        function createFactorySymbol() {
    const group = new THREE.Group();
    
    // Factory building
    const buildingGeometry = new THREE.BoxGeometry(0.5, 0.3, 0.1);
    const buildingMaterial = new THREE.MeshBasicMaterial({ color: 0xdddddd });
    const building = new THREE.Mesh(buildingGeometry, buildingMaterial);
    group.add(building);
    
    // Chimney
    const chimneyGeometry = new THREE.CylinderGeometry(0.06, 0.08, 0.3, 8);
    const chimneyMaterial = new THREE.MeshBasicMaterial({ color: 0xff3333 });
    const chimney = new THREE.Mesh(chimneyGeometry, chimneyMaterial);
    chimney.position.set(0.15, 0.3, 0);
    chimney.rotation.x = -Math.PI / 2;
    group.add(chimney);
    
    // Create multiple smoke particles for more realistic effect
    const smokeParticles = new THREE.Group();
    group.add(smokeParticles);
    
    // Create multiple smoke puffs
    const numSmokePuffs = 8;
    const smokePuffs = [];
    
    for (let i = 0; i < numSmokePuffs; i++) {
        // Create smoke with varying sizes
        const size = 0.05 + Math.random() * 0.1;
        const smokeGeometry = new THREE.SphereGeometry(size, 8, 6);
        
        // Create gradient material for more realistic smoke
        const smokeMaterial = new THREE.MeshStandardMaterial({ 
            color: new THREE.Color(0xeeeeee),
            transparent: true,
            opacity: 0.6 - (i * 0.05),
            roughness: 1,
            metalness: 0
        });
        
        const smoke = new THREE.Mesh(smokeGeometry, smokeMaterial);
        
        // Position smoke puffs in a rising pattern
        const xOffset = 0.15 + (Math.random() * 0.1 - 0.05);
        const yOffset = 0.5 + (i * 0.12);
        const zOffset = (Math.random() * 0.1 - 0.05);
        
        smoke.position.set(xOffset, yOffset, zOffset);
        smoke.scale.y = 1.2 + (i * 0.1); // Make smoke more elongated as it rises
        
        // Slightly rotate each puff for variety
        smoke.rotation.z = Math.random() * Math.PI;
        
        // Add animation data to the smoke puff
        smoke.userData = {
            initialY: smoke.position.y,
            speed: 0.001 + (Math.random() * 0.002),
            wiggle: 0.0005 + (Math.random() * 0.001),
            wiggleOffset: Math.random() * Math.PI * 2
        };
        
        smokeParticles.add(smoke);
        smokePuffs.push(smoke);
    }
    
    // Add animation function to the group
    group.userData.animateSmoke = function(time) {
        smokeParticles.children.forEach((smoke, index) => {
            // Move smoke upward
            smoke.position.y += smoke.userData.speed;
            
            // Add slight horizontal movement (wiggle)
            smoke.position.x = 0.15 + Math.sin(time * 0.5 + smoke.userData.wiggleOffset) * smoke.userData.wiggle;
            
            // Make smoke fade out as it rises
            smoke.material.opacity = Math.max(0, 0.6 - (smoke.position.y - smoke.userData.initialY) * 0.3);
            
            // Make smoke expand as it rises
            const expansionFactor = 1 + (smoke.position.y - smoke.userData.initialY) * 0.2;
            smoke.scale.set(expansionFactor, expansionFactor, expansionFactor);
            
            // Reset smoke puff when it gets too high or fades out
            if (smoke.position.y > smoke.userData.initialY + 1.5 || smoke.material.opacity <= 0) {
                smoke.position.y = smoke.userData.initialY;
                smoke.position.x = 0.15 + (Math.random() * 0.1 - 0.05);
                smoke.position.z = (Math.random() * 0.1 - 0.05);
                smoke.material.opacity = 0.6;
                smoke.scale.set(1, 1.2, 1);
                smoke.userData.wiggleOffset = Math.random() * Math.PI * 2;
            }
        });
    };
    
    return group;
}

        function updateCameraPosition() {

        function launchConfetti() {
    const canvas = document.getElementById('confettiCanvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const ctx = canvas.getContext('2d');

    const particles = [];
    for (let i = 0; i < 1000; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height - canvas.height,
            color: `hsl(${Math.random() * 360}, 100%, 60%)`,
            radius: Math.random() * 4 + 2,
            speed: Math.random() * 3 + 2,
            angle: Math.random() * 2 * Math.PI,
        });
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.y += p.speed;
            p.x += Math.sin(p.angle);
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, 2 * Math.PI);
            ctx.fillStyle = p.color;
            ctx.fill();
        });
        requestAnimationFrame(animate);
    }

    animate();
}

        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta()*7; // bear speed
            const elapsedTime = clock.getElapsedTime();
            
            // Handle bear movement
            // Dampen velocity
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            
            // Set direction based on controls
            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveLeft) - Number(moveRight);
            direction.normalize();
            
            // Check if bear is moving and update walking state
            isWalking = (moveForward || moveBackward || moveLeft || moveRight);
            
            // Move bear based on direction and rotation
            if (moveForward || moveBackward) {
                velocity.z -= direction.z * 30.0 * delta;
            }
            if (moveLeft || moveRight) {
                velocity.x -= direction.x * 30.0 * delta;
            }
            
            // Apply rotation to movement direction
            const movementVector = new THREE.Vector3(velocity.x, 0, velocity.z);
            movementVector.applyAxisAngle(new THREE.Vector3(0, 1, 0), bear.rotation.y);
            
            // Move bear
            bear.position.x += movementVector.x * delta;
            bear.position.z += movementVector.z * delta;
            
            // Update camera position to follow bear
            updateCameraPosition();
            
            // Animate bear walking
            animateBearWalking();
            
            // Animate snow particles
            animateSnow();
            
            
            // Animate icebergs (melting/restoring)
            animateIcebergs();
            
            // Animate smoke particles
            const smokeParticles = factory.children[3].children;
            smokeParticles.forEach(particle => {
                particle.position.add(particle.userData.velocity);
                
                // Reset particles that have risen too high
                if (particle.position.y > 25) {
                    particle.position.set(
                        3 + (Math.random() - 0.5) * 2,
                        12,
                        3 + (Math.random() - 0.5) * 2
                    );
                }
            });
            
            // Check if bear is near factory
            const distanceToFactory = bear.position.distanceTo(factory.position);
            
            if (distanceToFactory < 10 && !factoryFound) {
                factoryFound = true;
                
                // Show success message
                const successDiv = document.createElement('div');
                successDiv.style.position = 'absolute';
                successDiv.style.top = '50%';
                successDiv.style.left = '50%';
                successDiv.style.transform = 'translate(-50%, -50%)';
                successDiv.style.backgroundColor = 'rgba(0, 0, 0, 0.7)';
                successDiv.style.color = 'white';
                successDiv.style.padding = '20px';
                successDiv.style.borderRadius = '10px';
                successDiv.style.textAlign = 'center';
                // successDiv.innerHTML = '<h2>Success!</h2><p>You found the factory and stopped the pollution!</p><p>The polar bear can now live in a healthier environment.</p>';
                successDiv.innerHTML = '<h2>نجاح!</h2><p>لقد وجدت المصنع وأوقفت التلوث!</p><p>الآن يمكن للدب القطبي أن يعيش في بيئة صحية.</p>';

                document.getElementById('gameContainer').appendChild(successDiv);

                launchConfetti();

                // 7ayed l msg de success after 10sec :) 
                setTimeout(() => {
                            document.getElementById('gameContainer').removeChild(successDiv);
                        }, 10000);

                // Gradually lower temperature
                const lowerTemp = setInterval(() => {
                    if (temperature > -5) {
                        temperature -= 0.5;
                        updateThermometer();
                        
                        // Gradually change sky color
                        const t = (5 - temperature) / 10; // 0 to 1 as temp goes from 5 to -5
                        scene.background.lerpColors(pollutedSkyColor, skyColor, t);
                        scene.fog.color.lerpColors(pollutedSkyColor, skyColor, t);
                        
                        // Gradually reduce smoke opacity
                        smokeParticles.forEach(particle => {
                            particle.material.opacity = 0.7 * (1 - t);
                        });
                    } else {
                        clearInterval(lowerTemp);
                    }
                }, 200);
            }
            
            // Check if bear is near any of the marker icebergs
            icebergs.forEach(iceberg => {
                if (iceberg.userData.isMarker) {
                    const distanceToMarker = bear.position.distanceTo(iceberg.position);
                    
                    // If bear is close to a marker and hasn't found it yet
                    if (distanceToMarker < 5 && !iceberg.userData.found  && !factoryFound) {
                        iceberg.userData.found = true;
                        foundCheckpoints++;
                        
                        // Show checkpoint message
                        const checkpointDiv = document.createElement('div');
                        checkpointDiv.style.position = 'absolute';
                        checkpointDiv.style.top = '30%';
                        checkpointDiv.style.left = '50%';
                        checkpointDiv.style.transform = 'translate(-50%, -50%)';
                        checkpointDiv.style.backgroundColor = 'rgba(0, 100, 200, 0.7)';
                        checkpointDiv.style.color = 'white';
                        checkpointDiv.style.padding = '15px';
                        checkpointDiv.style.borderRadius = '10px';
                        checkpointDiv.style.textAlign = 'center';
                        checkpointDiv.style.zIndex = '100';
                        
                        // if (iceberg.userData.markerIndex === 0) {
                        //     checkpointDiv.innerHTML = '<h3>First Checkpoint Found!</h3><p>Follow the markers to find the factory.</p>';
                        // } else if (iceberg.userData.markerIndex === icebergs.filter(i => i.userData.isMarker).length - 1) {
                        //     checkpointDiv.innerHTML = '<h3>Last Checkpoint Found!</h3><p>The factory is close. Go stop the pollution!</p>';
                        // } else {
                        //     checkpointDiv.innerHTML = `<h3>Checkpoint ${iceberg.userData.markerIndex + 1} Found!</h3><p>Keep following the path.</p>`;
                        // }

                        if (iceberg.userData.markerIndex === 0) {
    checkpointDiv.innerHTML = '<h3>تم العثور على أول نقطة وصول!</h3><p>اتبع العلامات للعثور على المصنع.</p>';
} else if (iceberg.userData.markerIndex === icebergs.filter(i => i.userData.isMarker).length - 1) {
    checkpointDiv.innerHTML = '<h3>تم العثور على آخر نقطة وصول!</h3><p>المصنع قريب. اذهب وأوقف التلوث!</p>';
} else {
    checkpointDiv.innerHTML = `<h3>تم العثور على نقطة وصول رقم ${iceberg.userData.markerIndex + 1}!</h3><p>واصل اتباع الطريق.</p>`;
}

                        
                        document.getElementById('gameContainer').appendChild(checkpointDiv);
                        
                        // Remove the message after a few seconds
                        setTimeout(() => {
                            document.getElementById('gameContainer').removeChild(checkpointDiv);
                        }, 3000);
                    }
                }
            });
            
            // Render scene
            renderer.render(scene, camera);
        }
        
        function updateThermometer() {
            // Update thermometer display
            const tempHeight = (temperature + 10) / 30 * 100; // Map -10°C to 20°C to 0-100% :)
            document.getElementById('temperature').style.height = tempHeight + '%';
            document.getElementById('tempValue').textContent = temperature.toFixed(1) + '°C';
        }
        
        // Start the game : made for MSO 12th edition ... ENJOY
        init();
    </script>
</body>
</html>
